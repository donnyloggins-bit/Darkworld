<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030205">
<meta name="robots" content="noindex">
<title>DARKWORLD — Thank you</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=IM+Fell+English&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:#030205; color:#e0d0b0; }
  body { font-family:'IM Fell English', Georgia, serif; font-size:18px; line-height:1.5; min-height:100vh;
    background:radial-gradient(ellipse at top, #1a0a1e 0%, #030205 60%) fixed;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing:border-box; }
  main { max-width:520px; }
  h1 { font-family:'Metal Mania', cursive; color:#d4a020; font-size:2.2rem; font-weight:normal; margin:0 0 8px; text-shadow:0 0 12px rgba(204,32,32,.45); }
  .sigil { font-size:2.6rem; margin-bottom:6px; }
  a.btn { display:inline-block; margin-top:20px; padding:13px 22px; border:1px solid #cc2020; background:linear-gradient(#8b1a1a, #4a0c0c);
    color:#ede0c8; text-decoration:none; font-family:'Metal Mania', cursive; font-size:1.3rem; letter-spacing:.08em; border-radius:3px; }
  .small { color:#8a7aa0; font-size:.9rem; margin-top:16px; font-family:'Share Tech Mono', monospace; }
</style>
</head>
<body>
<main>
  <div class="sigil">🕯</div>
  <h1>Report received</h1>
  <p>Thank you, hunter. Your report helps make the city darker and the hunt better.</p>
  <a class="btn" href="/index.html">◀ BACK TO THE GAME</a>
  <p class="small">Found something else? <a href="/feedback.html" style="color:#e06060">Send another report</a></p>
</main>
</body>
</html>
